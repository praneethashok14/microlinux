[package]
name = "ml-installer"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"
description = "MicroLinux graphical installer and system update window (front ends for ml-install and ml-system-update)"
license = "MIT"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["glow", "x11", "default_fonts"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
