# Embedded in the GRUB EFI loader (BOOTAA64.EFI / BOOTX64.EFI) and the BIOS
# El Torito image. UEFI: prefer a grub.cfg on the partition the loader was
# started from (installed system: ESP). Otherwise (live medium, and always on
# BIOS, where $root is only a guess) look for the live medium.
set ml_found=
if [ "$grub_platform" = efi ]; then
  if [ -f ($root)/boot/grub/grub.cfg ]; then
    set ml_found=1
  fi
fi
if [ -z "$ml_found" ]; then
  search --no-floppy --set=root --file /boot/grub/microlinux-live.id
fi
set prefix=($root)/boot/grub
configfile $prefix/grub.cfg
