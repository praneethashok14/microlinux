# MicroLinux live medium boot menu (installed to /boot/grub/grub.cfg on the ISO).
set default=0
set timeout=5
set timeout_style=menu
insmod all_video
insmod gfxterm
set menu_color_normal=light-gray/black
set menu_color_highlight=black/cyan

search --no-floppy --set=root --file /boot/grub/microlinux-live.id

# BIOS: hand the kernel a VESA framebuffer (UEFI always provides GOP)
if [ "$grub_platform" = pc ]; then
  set gfxpayload=1280x800x32,1024x768x32,auto
fi

set kernel=/boot/vmlinuz
set initrd=/boot/initramfs.cpio.gz
set base="ml.live=LABEL=MICROLINUX console=@SERIAL@,115200 console=tty1"

menuentry "MicroLinux @VERSION@ (live desktop)" --id live {
  linux $kernel $base quiet loglevel=3
  initrd $initrd
}
menuentry "MicroLinux (live, copy system to RAM)" --id toram {
  linux $kernel $base quiet loglevel=3 ml.toram
  initrd $initrd
}
menuentry "MicroLinux (safe graphics: firmware framebuffer, no KMS)" --id safegfx {
  linux $kernel $base quiet loglevel=3 nomodeset ml.safegfx
  initrd $initrd
}
menuentry "MicroLinux (text mode, no desktop)" --id text {
  linux $kernel $base loglevel=4 ml.nox
  initrd $initrd
}
menuentry "MicroLinux (persistent: keep changes on ext4 partition labelled MLPERSIST)" --id persist {
  linux $kernel $base quiet loglevel=3 ml.persist=LABEL=MLPERSIST
  initrd $initrd
}
submenu "Troubleshooting  >" {
  menuentry "Recovery: root shell, no network, no desktop" --id recovery {
    linux $kernel $base loglevel=4 ml.recovery ml.nox
    initrd $initrd
  }
  menuentry "Emergency: initramfs shell before mounting the root filesystem" --id emergency {
    linux $kernel $base loglevel=7 ml.break
    initrd $initrd
  }
  menuentry "Verbose boot (all kernel and init messages)" --id verbose {
    linux $kernel $base loglevel=7 ml.debug
    initrd $initrd
  }
  menuentry "Boot without optional modules (no Firefox / EL7 runtime)" --id nomodules {
    linux $kernel $base loglevel=4 ml.nomodules
    initrd $initrd
  }
  if [ "$grub_platform" = efi ]; then
    menuentry "UEFI firmware settings" { fwsetup }
  fi
  menuentry "Reboot" { reboot }
  menuentry "Power off" { halt }
}
