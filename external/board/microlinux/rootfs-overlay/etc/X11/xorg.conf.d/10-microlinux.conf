# Let Xorg pick the driver itself: modesetting on any KMS device (virtio-gpu,
# simpledrm on UEFI framebuffers), fbdev as fallback. On x86_64 modesetting
# uses glamor on Intel, AMD and NVIDIA GPUs (hardware OpenGL through DRI3);
# elsewhere, and on aarch64, rendering is a shadow framebuffer in software.
Section "ServerFlags"
	Option "AutoAddDevices" "true"
EndSection
