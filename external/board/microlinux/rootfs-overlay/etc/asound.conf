# MicroLinux: programs that play through ALSA's default device (speaker-test,
# aplay, ...) go through PulseAudio, which owns the sound card in a desktop
# session; without PulseAudio (at boot, as root) they use the card directly.
# The volume controls stay on the card's own mixer (ctl is not redirected).
pcm.!default {
	type pulse
	fallback "sysdefault"
	hint {
		show on
		description "Default (PulseAudio)"
	}
}
