# MicroLinux: desktop (wallpaper) and file manager defaults
[Desktop]
Wallpaper=/usr/share/microlinux/wallpaper.png
WallpaperMode=stretch
BgColor=#2e3440
FgColor=#eceff4
ShadowColor=#000000
# no desktop icons: without gvfs pcmanfm-qt cannot mark its own shortcut
# files as trusted and shows them as plain "user-home.desktop" files
DesktopShortcuts=@Invalid()

[System]
Terminal=qterminal
Archiver=lxqt-archiver
