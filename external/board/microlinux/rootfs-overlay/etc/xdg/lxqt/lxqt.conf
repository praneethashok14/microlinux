# MicroLinux: LXQt appearance defaults
[General]
theme=Clearlooks
icon_theme=Adwaita
single_click_activate=false
tool_button_style=ToolButtonTextBesideIcon
palette_override=true

[Qt]
font="DejaVu Sans,10,-1,5,50,0,0,0,0,0"
doubleClickInterval=400
style=Fusion
wheelScrollLines=3

[Screensaver]
lock_command=dm-tool lock
