panels=panel1

[panel1]
plugins=fancymenu,quicklaunch,taskbar,desktopswitch,statusnotifier,tray,mount,volume,worldclock,showdesktop
position=Bottom
desktop=0
panelSize=36
iconSize=24

[fancymenu]
type=fancymenu
alignment=Left
filterClear=true
autoSel=true
autoSelDelay=150

[quicklaunch]
type=quicklaunch
alignment=Left
apps\size=4
apps\1\desktop=/usr/share/applications/qterminal.desktop
apps\2\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\3\desktop=/usr/local/share/applications/firefox.desktop
apps\4\desktop=/usr/share/applications/ml-settings.desktop

[taskbar]
type=taskbar
buttonWidth=220
closeOnMiddleClick=true
groupingEnabled=false

[desktopswitch]
type=desktopswitch

[mount]
type=mount

[worldclock]
type=worldclock

[volume]
device=0
type=volume
audioEngine=Alsa
mixerCommand=qterminal -e alsamixer

[showdesktop]
alignment=Right
type=showdesktop

[statusnotifier]
alignment=Right
type=statusnotifier

[tray]
type=tray
