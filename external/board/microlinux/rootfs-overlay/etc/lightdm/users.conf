# Users listed on the login screen. MicroLinux's 'user' has a UID below 500
# (Buildroot numbers users from 100 up); system accounts stay hidden because
# their shell is /bin/false.
[UserList]
minimum-uid=100
hidden-users=nobody nobody4 noaccess lightdm
hidden-shells=/bin/false /usr/sbin/nologin /sbin/nologin
