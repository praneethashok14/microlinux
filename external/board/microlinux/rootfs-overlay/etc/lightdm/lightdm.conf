# MicroLinux: LightDM starts the desktop at boot without asking for a password
# (autologin) and shows the login screen after logging out. Who logs in
# automatically: lightdm.conf.d/ (50-autologin.conf: the live user; ml-install
# writes 90-installed.conf). This file is read last, so it must not set it.
[LightDM]
minimum-vt=7
user-authority-in-system-dir=false
logind-check-graphical=false

[Seat:*]
greeter-session=lightdm-gtk-greeter
user-session=lxqt
session-wrapper=/usr/libexec/ml-xsession
xserver-command=X
autologin-user-timeout=0
greeter-hide-users=false
allow-guest=false
