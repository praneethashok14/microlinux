# AMD and NVIDIA GPUs need firmware from the package repository
# (sudo mlpkg install firmware-amdgpu / firmware-nvidia, then reboot). Without
# it their drivers would take the screen over from the boot framebuffer and
# then fail, leaving it black: load them only when the firmware is there.
install amdgpu /bin/sh -c 'test -d /lib/firmware/amdgpu && exec /sbin/modprobe --ignore-install amdgpu $CMDLINE_OPTS'
install radeon /bin/sh -c 'test -d /lib/firmware/radeon && exec /sbin/modprobe --ignore-install radeon $CMDLINE_OPTS'
install nouveau /bin/sh -c 'test -d /lib/firmware/nvidia && exec /sbin/modprobe --ignore-install nouveau $CMDLINE_OPTS'
